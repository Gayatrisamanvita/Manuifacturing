version: '3.8'

services:
  api:
    build: .
    container_name: factorysmart-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    command: python run_api.py --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    container_name: factorysmart-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
