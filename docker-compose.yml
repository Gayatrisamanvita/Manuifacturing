version: '3.8'

services:
  api:
    build: .
    container_name: factorysmart-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    command: python run_api.py --host 0.0.0.0 --port 8001

  dashboard:
    build: .
    container_name: factorysmart-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: streamlit run streamlit_app.py --server.port 8000 --server.address 0.0.0.0
